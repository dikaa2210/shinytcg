<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pembayaran - ShinyTCG</title>
    <link rel="stylesheet" href="copage.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<a href="javascript:history.back()" class="btn-back">
    <span class="arrow">←</span> Kembali
</a>
    <main class="checkout-container">
        <div class="checkout-wrapper">
            
            <div class="checkout-form">
                <h2>Alamat Pengiriman</h2>
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" placeholder="Masukkan nama penerima">
                </div>
                <div class="form-group">
                    <label>Nomor Telepon</label>
                    <input type="tel" placeholder="0812xxxx">
                </div>
                <div class="form-group">
                    <label>Alamat Lengkap</label>
                    <textarea placeholder="Nama jalan, nomor rumah, kelurahan, kecamatan"></textarea>
                </div>
                
                <h2 style="margin-top: 30px;">Metode Pembayaran</h2>
                <div class="payment-options">
                    <label class="pay-item">
                        <input type="radio" name="pay" checked>
                        <span>Transfer Bank (BCA/Mandiri)</span>
                    </label>
                    <label class="pay-item">
                        <input type="radio" name="pay">
                        <span>E-Wallet (Gopay/OVO/Dana)</span>
                    </label>
                </div>
            </div>

            <div class="checkout-summary">
                <h3>Ringkasan Pesanan</h3>
                <div class="product-mini">
                    <img src="img/image-removebg-preview (6).png" alt="item">
                    <div>
                        <p>Pokemon English - BOOSTER PACK</p>
                        <small>1 Barang (500gr)</small>
                    </div>
                </div>
                
                <hr>
                
                <div class="summary-line">
                    <span>Total Harga</span>
                    <span>IDR 325.000</span>
                </div>
                <div class="summary-line">
                    <span>Biaya Pengiriman</span>
                    <span>IDR 20.000</span>
                </div>
                <div class="summary-line total-final">
                    <span>Total Tagihan</span>
                    <span>IDR 345.000</span>
                </div>

                <button class="btn-pay" onclick="prosesBayar()">Bayar Sekarang</button>
            </div>

        </div>
    </main>

    <script>
        function prosesBayar() {
            alert("Pesananmu sedang diproses! Terima kasih telah belanja di ShinyTCG.");
            localStorage.clear(); // Bersihkan keranjang setelah belanja
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
