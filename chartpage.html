<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Keranjang Belanja - PokeMart</title>
    <link rel="stylesheet" href="chartpage.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<a href="javascript:history.back()" class="btn-back">
    <span class="arrow">←</span> Kembali
</a>
    <div class="cart-container">
        <h1>Keranjang Belanja</h1>

        <div class="cart-wrapper">
            <div class="cart-items">
                <div class="cart-item">
                    <img src="img/image-removebg-preview (6).png" alt="Pokemon Card">
                    <div class="item-info">
                        <h3>POKEMON ENGLISH - BOOSTER PACK</h3>
                        <p class="item-price">IDR 325.000</p>
                    </div>
                    <div class="item-quantity">
                        <button>-</button>
                        <input type="number" value="1">
                        <button>+</button>
                    </div>
                    <p class="item-subtotal">IDR 325.000</p>
                    <button class="btn-remove">🗑️</button>
                </div>

            <div class="cart-summary">
                <h3>Ringkasan Belanja</h3>
                <div class="summary-line">
                    <span>Total Harga (1 Barang)</span>
                    <span>IDR 325.000</span>
                </div>
                <div class="summary-line">
                    <span>Ongkos Kirim</span>
                    <span>IDR 20.000</span>
                </div>
                <hr>
                <div class="summary-line total">
                    <span>Total Bayar</span>
                    <span>IDR 345.000</span>
                </div>
                <a href="copage.html"
                button class="btn-checkout">Beli Sekarang</button> </a>
            </div>
        </div>
    </div>

    </body>
</html>
